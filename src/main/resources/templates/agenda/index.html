<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel :: head('Agenda')}"></head>
<body class="mn-panel mn-psicologos mn-planificacion">
<div class="mn-layout"><aside th:replace="~{fragments/panel :: sidebar('agenda')}"></aside>
<main class="mn-main psi-main">
<div class="psi-page-top"><header th:replace="~{fragments/panel :: topbar(${usuarioSesion.rol == 'PSICOLOGO' ? 'Mi agenda' : 'Agenda'}, ${usuarioSesion.rol == 'PSICOLOGO' ? 'Consulta tus citas por día o semana.' : 'Consulta las citas del equipo por día o semana.'})}"></header><span class="psi-context"><span class="psi-dot"></span> Equipo clínico</span></div>
<div th:if="${exito}" class="psi-alert psi-alert--success" role="status" th:text="${exito}"></div>
<div th:if="${error}" class="psi-alert psi-alert--error" role="alert" th:text="${error}"></div>

<div class="psi-section-heading"><div><p class="psi-eyebrow">PLANIFICACIÓN DE CITAS</p><h2 th:text="${vista == 'semana'} ? 'Agenda semanal' : 'Agenda diaria'"></h2><p><span th:text="${#temporals.format(desde,'dd/MM/yyyy')}"></span><span th:if="${vista == 'semana'}" th:text="' al ' + ${#temporals.format(hasta,'dd/MM/yyyy')}"></span> · <span th:text="${totalCitas}"></span> citas</p></div></div>
<section class="psi-directory"><form th:action="@{/agenda}" method="get" class="plan-filter"><div class="psi-field"><label for="fecha">Fecha</label><input type="date" id="fecha" name="fecha" th:value="${fecha}" required></div><div class="psi-field"><label for="vista">Vista</label><select id="vista" name="vista"><option value="dia" th:selected="${vista == 'dia'}">Día</option><option value="semana" th:selected="${vista == 'semana'}">Semana</option></select></div><div th:if="${usuarioSesion.rol != 'PSICOLOGO'}" class="psi-field"><label for="psicologoId">Profesional</label><select id="psicologoId" name="psicologoId"><option value="">Todos los psicólogos</option><option th:each="p : ${profesionales}" th:value="${p.id}" th:selected="${p.id == psicologoId}" th:text="${p.usuario.nombres + ' ' + p.usuario.apellidos}"></option></select></div><button type="submit" class="psi-button psi-button--primary"><i class="bi bi-calendar3" aria-hidden="true"></i> <span>Ver agenda</span></button></form>
<nav class="plan-agenda-nav" aria-label="Cambiar periodo"><a th:href="@{/agenda(fecha=${anterior},vista=${vista},psicologoId=${psicologoId})}" class="psi-action"><i class="bi bi-chevron-left" aria-hidden="true"></i> <span>Anterior</span></a><a th:href="@{/agenda(fecha=${hoy},vista=${vista},psicologoId=${psicologoId})}" class="psi-action"><i class="bi bi-calendar-event" aria-hidden="true"></i> <span>Hoy</span></a><a th:href="@{/agenda(fecha=${siguiente},vista=${vista},psicologoId=${psicologoId})}" class="psi-action"><span>Siguiente</span> <i class="bi bi-chevron-right" aria-hidden="true"></i></a></nav></section>
<div class="plan-agenda" th:classappend="${vista == 'semana'} ? 'plan-agenda--week'">
<section th:each="dia : ${diasAgenda}" class="psi-directory plan-day"><div class="psi-directory__heading"><h3 th:text="${#temporals.format(dia.fecha,'EEEE dd/MM',idioma)}"></h3><span class="psi-count" th:text="${#lists.size(dia.citas)}"></span></div>
<article th:each="c : ${dia.citas}" class="plan-appointment" th:classappend="${c.estado == 'CANCELADA'} ? 'plan-appointment--cancelled'">
<div class="plan-appointment__time" th:text="${#temporals.format(c.inicio,'HH:mm')+' – '+#temporals.format(c.fin,'HH:mm')}"></div><div class="plan-appointment__details"><strong th:text="${c.paciente}"></strong><span th:text="${c.psicologo}"></span><span th:text="${c.modalidad == 'VIRTUAL'} ? 'Virtual' : 'Presencial'"></span></div><span class="mn-estado" th:classappend="'mn-tone--'+${c.estado}" th:text="${c.estadoNombre}"></span></article>
<p th:if="${#lists.isEmpty(dia.citas)}" class="plan-no-data">Sin citas registradas.</p></section></div>

<footer class="psi-page-footer">MenteNova · Centro Psicológico</footer>
</main></div><th:block th:replace="~{fragments/panel :: scripts}"></th:block>
</body></html>

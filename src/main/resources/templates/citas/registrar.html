<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/panel :: head('Registrar Cita')}"></head>

<body>

<aside th:replace="~{fragments/panel :: sidebar('citas')}"></aside>

<main class="ms-lg-5 p-4">

    <header th:replace="~{fragments/panel :: topbar(
            'Registrar Cita',
            'Nueva cita psicológica')}">
    </header>

    <div class="container-fluid">

        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <form>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Paciente
                            </label>

                            <input type="text"
                                   class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Psicólogo
                            </label>

                            <input type="text"
                                   class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Fecha
                            </label>

                            <input type="date"
                                   class="form-control">

                        </div>

                        <div class="col-md-3 mb-3">

                            <label class="form-label">
                                Hora Inicio
                            </label>

                            <input type="time"
                                   class="form-control">

                        </div>

                        <div class="col-md-3 mb-3">

                            <label class="form-label">
                                Hora Fin
                            </label>

                            <input type="time"
                                   class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Modalidad
                            </label>

                            <select class="form-select">

                                <option>PRESENCIAL</option>
                                <option>VIRTUAL</option>

                            </select>

                        </div>

                        <div class="col-md-12 mb-3">

                            <label class="form-label">
                                Observación
                            </label>

                            <textarea rows="4"
                                      class="form-control"></textarea>

                        </div>

                    </div>

                    <button class="btn btn-primary">

                        Guardar Cita

                    </button>

                    <a th:href="@{/citas}"
                       class="btn btn-secondary">

                        Volver

                    </a>

                </form>

            </div>

        </div>

    </div>

</main>

<th:block th:replace="~{fragments/panel :: scripts}"></th:block>

</body>
</html>

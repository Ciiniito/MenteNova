<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es">
<head th:replace="~{fragments/panel :: head('Error inesperado')}"></head>
<body class="mn-panel">
<main class="mn-error-page">
    <div class="mn-card mn-error-card">
        <div class="mn-kpi__icon mn-tone--CANCELADA"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i></div>
        <h1 class="h4 fw-bold">Ocurrió un error inesperado</h1>
        <p class="text-secondary">
            No pudimos completar la operación. Inténtalo de nuevo en unos minutos;
            si el problema continúa, avisa al administrador.
        </p>
        <a th:href="@{/inicio}" class="btn btn-primary mt-2"><i class="bi bi-house-door" aria-hidden="true"></i> <span>Volver al inicio</span></a>
    </div>
</main>
</body>
</html>

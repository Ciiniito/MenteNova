# ============================================================================
# MenteNova - Configuración de la aplicación (APF2 - Fase de Login)
# ============================================================================

# Servidor
server.port=8080
server.servlet.context-path=/mentenova

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Base de datos PostgreSQL
# AJUSTA spring.datasource.username y spring.datasource.password
# según el usuario y contraseña que crees en tu PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/mentenova
spring.datasource.username=mentenova_app
spring.datasource.password=mentenova_app
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# No ejecutar data.sql automáticamente al arrancar (evita fallo si el esquema no existe aún)
spring.datasource.initialization-mode=never

# Seguridad
app.security.enabled=true